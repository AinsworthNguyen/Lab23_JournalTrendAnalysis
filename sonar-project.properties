# SonarQube Project Configuration for Journal Trend Analysis (Flutter)

# Project Identification
sonar.projectKey=journal_trend_analysis
sonar.projectName=Journal Trend Analysis
sonar.projectVersion=1.0.0

# Encoding
sonar.sourceEncoding=UTF-8

# Source & Test Code Paths
sonar.sources=lib
sonar.tests=test

# Test Coverage & Flutter Analyze Report Paths
sonar.dart.lcov.reportPaths=coverage/lcov.info
sonar.flutter.analyzer.reportPath=flutter_analyze.txt
sonar.dart.analyzer.reportPath=flutter_analyze.txt

# Global Exclusions (Exclude auto-generated code, mock datasets, build outputs, and native platform dirs)
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,lib/generated/**,**/firebase_options.dart,**/mock_data.dart,**/mock_*.dart,**/build/**,.dart_tool/**,android/**,ios/**,web/**,windows/**,macos/**,linux/**,assets/**

# Coverage Exclusions (Exclude UI screens/widgets that don't need unit test coverage metrics)
sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,lib/generated/**,test/**,lib/features/**/presentation/screens/**,lib/features/**/presentation/widgets/**,lib/main.dart

# Ignore non-critical pedantic code smell rules across all files
sonar.issue.ignore.multicriteria=r1,r2,r3,r4,r5,r6
sonar.issue.ignore.multicriteria.r1.ruleKey=*type_annotate*
sonar.issue.ignore.multicriteria.r1.resourceKey=**/*.dart
sonar.issue.ignore.multicriteria.r2.ruleKey=*prefer_final_parameters*
sonar.issue.ignore.multicriteria.r2.resourceKey=**/*.dart
sonar.issue.ignore.multicriteria.r3.ruleKey=*sort_constructors_first*
sonar.issue.ignore.multicriteria.r3.resourceKey=**/*.dart
sonar.issue.ignore.multicriteria.r4.ruleKey=*type_annotation*
sonar.issue.ignore.multicriteria.r4.resourceKey=**/*.dart
sonar.issue.ignore.multicriteria.r5.ruleKey=*debugDescribeChildren*
sonar.issue.ignore.multicriteria.r5.resourceKey=**/*.dart
sonar.issue.ignore.multicriteria.r6.ruleKey=*debugFillProperties*
sonar.issue.ignore.multicriteria.r6.resourceKey=**/*.dart
