# Project identification
sonar.projectKey=journal_trend_analysis
sonar.projectName=Journal Trend Analysis
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=lib
sonar.tests=test

# Language and files configuration
sonar.language=dart
sonar.sourceEncoding=UTF-8

# Exclude auto-generated code and UI translations from analysis
sonar.exclusions=**/*.g.dart,**/*.config.dart,assets/translations/**,lib/injection_container.dart

# Connection to local SonarQube server
sonar.host.url=http://localhost:9000

# Path to code coverage report (generated by flutter test --coverage)
sonar.dart.coverage.reportPath=coverage/lcov.info

